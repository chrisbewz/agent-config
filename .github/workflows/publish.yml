name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── Build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI (OIDC trusted publishing — no stored secrets) ─────────
  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Update Homebrew formula ───────────────────────────────────────────────
  homebrew:
    name: Update Homebrew formula
    needs: pypi
    runs-on: ubuntu-latest

    steps:
      - name: Bump formula version
        uses: mislav/bump-homebrew-formula@v3
        with:
          formula-name: agent-config
          formula-path: Formula/agent-config.rb
          homebrew-tap: chrisbewz/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/chrisbewz/agent-config/archive/refs/tags/${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
