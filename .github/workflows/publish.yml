name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── Build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI (OIDC trusted publishing — no stored secrets) ─────────
  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Update Homebrew formula ───────────────────────────────────────────────
  homebrew:
    name: Update Homebrew formula
    needs: pypi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: chrisbewz/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Compute sha256 and update formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          URL="https://github.com/chrisbewz/agent-config/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          VERSION="${TAG#v}"
          FORMULA="homebrew-tap/Formula/agent-config.rb"

          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA"

          echo "Updated formula to ${VERSION} (sha256: ${SHA})"
          cat "$FORMULA"

      - name: Commit and push formula update
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-config.rb
          git commit -m "chore: update agent-config formula to ${TAG}"
          git push

